[project]
name = "trellis2mlx"
version = "0.1.0"
description = "MLX-native TRELLIS.2 inference for Apple Silicon"
requires-python = ">=3.11"
dependencies = [
    "mlx>=0.30",
    "numpy",
    "huggingface-hub",
    "safetensors",
    "pillow",
    "trimesh",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]
convert = ["torch", "torchvision", "transformers"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"
